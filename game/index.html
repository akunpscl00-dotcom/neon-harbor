<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#140a22">
<title>Neon Harbor: Port Halcyon</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="view" aria-label="Neon Harbor: an open-world crime game set in the coastal city of Port Halcyon"></canvas>

<div id="hud" class="hidden">
  <div id="hud-top-right">
    <div id="hud-clock">17:30</div>
    <div id="hud-money">$0</div>
    <div id="hud-wanted"></div>
    <div id="hud-weapon"><span id="hud-weapon-name">Fists</span> <span id="hud-ammo"></span></div>
  </div>
  <div id="hud-objective"><div id="hud-mission-title"></div><div id="hud-mission-text"></div><div id="hud-timer"></div></div>
  <div id="hud-minimap-wrap">
    <canvas id="hud-minimap" width="220" height="220"></canvas>
    <div id="hud-bars"><div class="bar"><div id="hud-health"></div></div><div class="bar armor"><div id="hud-armor"></div></div></div>
  </div>
  <div id="hud-vehicle"><div id="hud-vehicle-name"></div><div id="hud-speed"></div><div id="hud-radio"></div></div>
  <div id="hud-district"></div>
  <div id="hud-subtitle"></div>
  <div id="hud-feed"></div>
  <div id="hud-prompt"></div>
  <div id="hud-crosshair"></div>
  <div id="hud-damage"></div>
  <div id="hud-big"></div>
</div>

<div id="title" class="screen">
  <div class="logo"><span class="logo-neon">NEON</span><span class="logo-harbor">HARBOR</span><div class="logo-sub">PORT HALCYON</div></div>
  <div class="menu" id="title-menu"></div>
  <div class="title-foot">An original open-world crime story &middot; keyboard &amp; mouse or touch</div>
</div>

<div id="pause" class="screen hidden">
  <div class="panel">
    <div class="tabs" id="pause-tabs"></div>
    <div class="panel-body" id="pause-body"></div>
  </div>
</div>

<div id="shop" class="screen hidden">
  <div class="panel small">
    <div class="panel-head" id="shop-title">Lockbox Arms</div>
    <div class="panel-body" id="shop-body"></div>
  </div>
</div>

<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
